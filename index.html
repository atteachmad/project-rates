async function api(action, params = {}) {
  let j;
  try {
    if (DEMO) j = await window.DEMO_API(action, { ...params, token: S.token });
    else {
      const r = await fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: S.token, ...params }) });
      j = await r.json();
    }
  } catch (e) { setOnline(false); const er = new Error('Tidak dapat terhubung ke server. Periksa internet Anda.'); er.code = 'NET'; throw er; }
  setOnline(true);
  if (!j.ok) { const er = new Error(j.error || 'Terjadi kesalahan'); er.code = j.code; if (j.code === 'AUTH' && S.token) logout(true); throw er; }
  return j.data;
}
function setOnline(v) { if (S.online === v) return; S.online = v; const el = $('#offline'); if (el) el.classList.toggle('hidden', v); }

function toast(msg, kind = 'ok') {

}
const guard = async (fn, btn) => {

/* ------------------------- SUARA DERING (Web Audio) -------------------- */
const Snd = {
  ctx: null, muted: store.get('pr_muted') === '1',
  unlock() {
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { }
  },
  get ready() { return !!this.ctx && this.ctx.state === 'running'; },
  tone(freq, t0, dur, vol = .25, type = 'sine') {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + .05);
  },
  ring(kind = 'task') {
    if (this.muted) return false;
    this.unlock();
    if (!this.ready) return false;
    const t = this.ctx.currentTime + .02;
    if (kind === 'task') {               // dering telepon: 3x (dua nada cepat)
      for (let i = 0; i < 3; i++) { const b = t + i * .9; [0, .22].forEach(o => { this.tone(880, b + o, .18, .32, 'square'); this.tone(660, b + o + .09, .09, .2, 'square'); }); }
    } else if (kind === 'assign') {      // chime naik 3 nada
      [523, 659, 784, 1047].forEach((f, i) => this.tone(f, t + i * .14, .35, .3, 'triangle'));
    } else {                             // update: dua nada lembut
      [660, 880].forEach((f, i) => this.tone(f, t + i * .16, .3, .22, 'sine'));
    }
    if (navigator.vibrate) try { navigator.vibrate(kind === 'task' ? [300, 120, 300, 120, 300] : [200, 100, 200]); } catch (e) { }
    return true;
  },
  setMuted(v) { this.muted = v; store.set('pr_muted', v ? '1' : '0'); updateBell(); }
};
['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => Snd.unlock(), { passive: true }));

const Seen = {
  key() { return 'pr_seen_' + (S.user ? S.user.email : ''); },
  load() { try { return JSON.parse(store.get(this.key()) || '{}'); } catch (e) { return {}; } },
  save(m) { store.set(this.key(), JSON.stringify(m)); },
  mark(tasks) { const m = this.load(); tasks.forEach(t => m[t.id] = t.updatedAt); this.save(m); }
};
const ringTimer = { t: null };
function computeAlerts(tasks) {
  const seen = Seen.load(), role = S.user.role, out = [];
  tasks.forEach(t => {
    const fresh = seen[t.id] !== t.updatedAt;
    if (!fresh) return;
    if (role === 'Koordinator' || role === 'Admin') { if (t.status === 'Menunggu Konfirmasi') out.push({ t, kind: 'task', text: `Task ${t.service} baru: ${t.project}` }); }
    else if (role === 'Driver') { if (t.status === 'Terkonfirmasi' && t.ship !== 'Selesai') out.push({ t, kind: 'assign', text: `Tugas baru: ${t.project} → ${t.dest}` }); }
    else if (role === 'Sales') {
      if (t.status === 'Terkonfirmasi') out.push({ t, kind: 'update', text: `${t.project}: ${t.ship} · ${t.petugas || '-'} / ${t.nopol || '-'}` });
      else if (t.status === 'Dibatalkan') out.push({ t, kind: 'update', text: `${t.project}: dibatalkan` });
    }
  });
  return out;
}
function applyTasks(tasks, initial = false) {
  S.tasks = tasks;
  const alerts = computeAlerts(tasks), prevIds = new Set(S.alerts.map(a => a.t.id + a.t.updatedAt));
  const fresh = alerts.filter(a => !prevIds.has(a.t.id + a.t.updatedAt));
  S.alerts = alerts;
  renderBanner();
  if (fresh.length) {
    const kind = fresh[0].kind;
    Snd.ring(kind);
    sysNotify(fresh[0].text + (fresh.length > 1 ? ` (+${fresh.length - 1} lainnya)` : ''));
    clearInterval(ringTimer.t);
    if (kind === 'task') ringTimer.t = setInterval(() => { if (S.alerts.some(a => a.kind === 'task')) Snd.ring('task'); else clearInterval(ringTimer.t); }, 15000);
  }
  if (!alerts.length) clearInterval(ringTimer.t);
  const nav = $('#nav-badge-ops'); if (nav) { const n = tasks.filter(t => t.status === 'Menunggu Konfirmasi').length; nav.textContent = n; nav.classList.toggle('hidden', !n); }
}
function ackAlerts() {
  Seen.mark(S.alerts.map(a => a.t)); S.alerts = []; clearInterval(ringTimer.t); renderBanner();
}
let titleT = null;
function renderBanner() {
  const el = $('#banner'), n = S.alerts.length;
  if (!el) return;
  clearInterval(titleT); document.title = CFG.APP_NAME;
  if (!n) { el.classList.add('hidden'); el.innerHTML = ''; updateBell(); return; }
  const k = S.alerts[0].kind, urgent = k === 'task';
  const head = urgent ? `${n} task baru menunggu konfirmasi` : k === 'assign' ? `${n} tugas baru untuk Anda` : `${n} pembaruan status penugasan`;
  const dest = S.user.role === 'Driver' ? 'tugas' : S.user.role === 'Sales' ? 'projects' : 'ops';
  el.className = `banner ${urgent ? 'urgent' : 'info'}`;
  el.innerHTML = `<div class="flex items-center gap-3 min-w-0">${ico('bell', 'w-6 h-6 ring-bell')}<div class="min-w-0"><div class="font-bold leading-tight">${esc(head)}</div>
    <div class="text-sm opacity-90 truncate">${esc(S.alerts.slice(0, 3).map(a => a.text).join('  •  '))}</div>
    ${!Snd.ready && !Snd.muted ? '<div class="text-xs opacity-80">Ketuk layar sekali untuk mengaktifkan suara dering</div>' : ''}</div></div>
    <div class="flex gap-2 shrink-0"><button class="btn-light" data-act="banner-go" data-to="${dest}">Lihat</button><button class="btn-ghost-w" data-act="banner-ack" aria-label="Tutup">${ico('x', 'w-4 h-4')}</button></div>`;
  let on = false; titleT = setInterval(() => { on = !on; document.title = on ? `(${n}) ${urgent ? 'TASK BARU!' : 'Update'}` : CFG.APP_NAME; }, 900);

function updateBell() {
  const b = $('#btn-sound'); if (b) { b.innerHTML = ico(Snd.muted ? 'mute' : 'volume'); b.title = Snd.muted ? 'Suara mati — ketuk untuk menyalakan' : 'Suara menyala — ketuk untuk mematikan'; b.classList.toggle('opacity-50', Snd.muted); }
  const c = $('#bell-count'); if (c) { c.textContent = S.alerts.length; c.classList.toggle('hidden', !S.alerts.length); }

async function sysNotify(text) {
  try {
    if (!('Notification' in window) || Notification.permission !== 'granted' || !document.hidden) return;
    const reg = await navigator.serviceWorker?.getRegistration();
    if (reg) reg.showNotification(CFG.APP_NAME, { body: text, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'pr-task', renotify: true, vibrate: [300, 120, 300] });
    else new Notification(CFG.APP_NAME, { body: text });
  } catch (e) { }
}
async function askNotifyPermission() {
  if (!('Notification' in window)) return toast('Browser tidak mendukung notifikasi sistem', 'err');
  const p = await Notification.requestPermission();
  toast(p === 'granted' ? 'Notifikasi sistem aktif (saat aplikasi terbuka di latar belakang)' : 'Notifikasi sistem ditolak', p === 'granted' ? 'ok' : 'err');
}

/* ------------- PUSH NOTIFICATION (FCM): dering saat browser / aplikasi ditutup ------------- */
const PushN = {
  cfg() { return CFG.FIREBASE && CFG.FIREBASE.apiKey && CFG.FIREBASE.vapidKey ? CFG.FIREBASE : null; },
  supported() { return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; },
  load(src) { return new Promise((res, rej) => { if ([...document.scripts].some(s => s.src === src)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Gagal memuat Firebase SDK')); document.head.appendChild(s); }); },
  async enable(interactive) {
    if (!this.cfg()) { if (interactive) return askNotifyPermission(); return; }
    if (!this.supported()) { if (interactive) toast('Browser ini belum mendukung push. iPhone: tambahkan aplikasi ke Layar Utama lebih dulu.', 'err'); return; }
    if (Notification.permission === 'default' && interactive) await Notification.requestPermission();
    if (Notification.permission !== 'granted') { if (interactive) toast('Izin notifikasi ditolak. Aktifkan lewat pengaturan situs di browser.', 'err'); return; }
    try {
      await this.load('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      await this.load('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js');
      const c = this.cfg(); if (!firebase.apps.length) firebase.initializeApp(c);
      const reg = await navigator.serviceWorker.ready;
      const token = await firebase.messaging().getToken({ vapidKey: c.vapidKey, serviceWorkerRegistration: reg });
      if (!token) throw new Error('Token notifikasi kosong');
      const key = (S.user ? S.user.email : '') + '|' + token;
      if (store.get('pr_push') !== key) { await api('push.register', { pushToken: token, device: navigator.userAgent.slice(0, 100) }); store.set('pr_push', key); }
      if (interactive) toast('Notifikasi latar belakang aktif di perangkat ini');
      const b = $('#push-bar'); if (b) b.remove();
    } catch (e) { if (interactive) toast('Gagal mengaktifkan notifikasi: ' + e.message, 'err'); }
  },
  prompt() {
    if (!this.cfg() || !this.supported() || $('#push-bar')) return;
    if (Notification.permission === 'granted') return this.enable(false);
    if (Notification.permission === 'denied' || store.get('pr_push_later') === todayStr()) return;
    const d = document.createElement('div'); d.id = 'push-bar';
    d.style.cssText = 'position:fixed;left:.75rem;right:.75rem;bottom:5.5rem;z-index:80;max-width:30rem;margin:0 auto;background:#14181a;color:#fff;border-radius:1.2rem;padding:.9rem 1rem;box-shadow:0 14px 30px -10px rgba(0,0,0,.5)';
    d.innerHTML = '<div style="font-weight:800">Aktifkan notifikasi</div><div style="font-size:.82rem;opacity:.8;margin:.2rem 0 .7rem">Agar tugas tetap berbunyi walau aplikasi / browser ditutup.</div><div style="display:flex;gap:.5rem"><button class="btn-light" data-act="push-on">Aktifkan</button><button class="btn-ghost-w" style="width:auto;padding:0 1rem" data-act="push-later">Nanti</button></div>';
    document.body.appendChild(d);
  },
  boot() {
    navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', e => {
      const m = e.data || {};
      if (m.type === 'push') pollOnce(true);
      if (m.type === 'nav' && m.url) { const h = String(m.url).split('#')[1]; if (h) location.hash = '#' + h; }
    });
    setTimeout(() => this.prompt(), 2000);
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'push-on') PushN.enable(true);
  if (el.dataset.act === 'push-later') { store.set('pr_push_later', todayStr()); const b = $('#push-bar'); if (b) b.remove(); }
});
  
/* ------------------------------ POLLING -------------------------------- */
async function pollOnce(force = false) {
  if (S.polling || !S.token || !S.user) return;
  S.polling = true;
  try {
    const r = await api('poll', { ver: force ? '0' : S.ver });
    if (r.changed) { S.ver = r.ver; applyTasks(r.tasks); if (S.pageRefresh) S.pageRefresh(); }
  } catch (e) { } finally { S.polling = false; }
}
function startPolling() { stopPolling(); S.pollTimer = setInterval(() => { if (!document.hidden || Math.random() < .34) pollOnce(); }, Math.max(4, CFG.POLL_SECONDS) * 1000); }
function stopPolling() { clearInterval(S.pollTimer); clearInterval(ringTimer.t); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollOnce(); });
window.addEventListener('online', () => pollOnce(true));

function logout(expired) {
  stopPolling(); store.del('pr_token'); S.token = ''; S.user = null; S.tasks = []; S.alerts = [];
  document.title = CFG.APP_NAME;
  if (window.showLogin) window.showLogin(expired ? 'Sesi berakhir, silakan masuk kembali.' : '');

const HOME = { Admin: 'overview', Sales: 'overview', Koordinator: 'ops', Driver: 'tugas' };

async function startApp() {
  if (!S.user) { const r = await api('me'); S.user = r.user; }
  S.boot = await api('bootstrap'); S.ver = S.boot.ver;
  S.filters = { ae: '', stage: '', q: '', period: 'month', sort: 'new' };
  const t = await api('tasks.list'); S.ver = t.ver;
  renderShell();
  applyTasks(t.tasks, true);
  startPolling();
  PushN.boot();
  route();
}

ACTIONS['toggle-sound'] = () => { Snd.unlock(); Snd.setMuted(!Snd.muted); toast(Snd.muted ? 'Suara dimatikan' : 'Suara dinyalakan'); if (!Snd.muted) Snd.ring('update'); };
ACTIONS['menu'] = () => $('#menu').classList.toggle('hidden');
ACTIONS['test-ring'] = () => { $('#menu').classList.add('hidden'); Snd.unlock(); const was = Snd.muted; Snd.muted = false; const ok = Snd.ring('task'); Snd.muted = was; toast(ok ? (was ? 'Tes dering (suara sedang dimatikan)' : 'Dering diputar') : 'Browser memblokir suara — ketuk layar lalu coba lagi', ok ? 'ok' : 'err'); };
ACTIONS['enable-notif'] = () => { $('#menu').classList.add('hidden'); PushN.enable(true); };

ACTIONS['logout'] = () => { api('me').catch(() => { }); logout(false); };
ACTIONS['banner-ack'] = () => ackAlerts();
ACTIONS['banner-go'] = el => { ackAlerts(); location.hash = '#/' + (el.dataset.to || HOME[S.user.role]); };
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!e.target.closest('.relative') ) { const m = $('#menu'); if (m) m.classList.add('hidden'); }
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) { if (el.tagName === 'A') e.preventDefault(); fn(el, e); }
});

/* ------------------------------ ROUTER --------------------------------- */
const PAGES = {};
window.addEventListener('hashchange', () => { if (S.user) route(); });
async function route() {
  if (!S.user) return;
  const nav = NAV[S.user.role];
  let key = (location.hash.replace(/^#\/?/, '').split('?')[0]) || HOME[S.user.role];
  if (!nav.some(n => n[0] === key)) key = HOME[S.user.role];
  S.page = key;
  $$('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === key));
  const act = $('#nav [data-nav].on'); if (act && act.scrollIntoView) act.scrollIntoView({ inline: 'center', block: 'nearest' });
  const view = $('#view');
  const page = PAGES[key];
  S.pageRefresh = () => { const a = document.activeElement; if (a && view.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; page.render(view, true); };
  view.innerHTML = `<div class="skel-wrap">${'<div class="skel"></div>'.repeat(4)}</div>`;
  try { await page.render(view, false); } catch (e) { if (e.code !== 'AUTH') view.innerHTML = `<div class="card text-center py-12"><p class="text-ember font-semibold">${esc(e.message)}</p><button class="btn-dark mt-4" data-act="refresh">Coba lagi</button></div>`; }
  view.focus({ preventScroll: true });
  window.scrollTo({ top: 0 });
}

/* ---------------------------- DATA PROYEK ------------------------------ */
function periodRange(p) {
  const n = new Date(), y = n.getFullYear();
  if (p === 'month') return monthRange(0);
  if (p === 'last') return monthRange(-1);
  if (p === '3m') return [monthRange(-2)[0], monthRange(0)[1]];
  if (p === 'year') return [`${y}-01-01`, `${y}-12-31`];
  return ['', ''];
}
const PERIODS = [['month', 'Bulan ini'], ['last', 'Bulan lalu'], ['3m', '3 bulan'], ['year', 'Tahun ini'], ['all', 'Semua']];
async function loadProjects(extra = {}) {
  const f = S.filters, [from, to] = periodRange(f.period);
  return api('projects.list', { ae: f.ae, stage: f.stage, q: f.q, from, to, sort: f.sort, limit: 40, offset: 0, ...extra });
}
const taskOf = id => S.tasks.find(t => t.id === id);
function dispatchChip(t) {
  if (!t) return '';
  if (t.status === 'Menunggu Konfirmasi') return chip('Menunggu koordinator', 'chip-amber blink');
  if (t.status === 'Dibatalkan') return chip('Dibatalkan', 'chip-red');
  return chip(t.ship, SHIP_CLS[t.ship] || 'chip-blue');
}
function periodBar(onchange = 'set-period') {
  return `<div class="seg" role="tablist" aria-label="Periode">${PERIODS.map(([k, l]) => `<button data-act="${onchange}" data-v="${k}" class="${S.filters.period === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
}
ACTIONS['set-period'] = el => { S.filters.period = el.dataset.v; route(); };

function projectCard(p, color = true) {
  const t = taskOf(p.id), isAdmin = S.user.role === 'Admin';
  const rates = p.rates != null ? rp(p.rates) : (p.ratesNote ? `<span class="text-xs">${esc(p.ratesNote)}</span>` : '-');
  return `<article class="pcard ${color ? stCls(p.stage) : ''}" data-act="open-project" data-id="${esc(p.id)}" tabindex="0" role="button">
    <div class="flex justify-between items-start gap-2"><div class="text-[11px] font-bold uppercase tracking-wide opacity-70">${esc(fmtD(p.pickup))}</div>${dispatchChip(t)}</div>
    <h3 class="font-bold text-[17px] leading-snug mt-1 line-clamp-2">${esc(p.name)}</h3>
    <div class="text-xs opacity-75 mt-0.5 truncate">${esc(p.ae)}</div>
    <div class="flex items-end justify-between mt-3 gap-2"><div class="text-xs opacity-80 min-w-0"><div class="truncate">${ico('pin', 'w-3.5 h-3.5 inline -mt-0.5')} ${esc(p.dest)}</div><div class="truncate">${ico('truck', 'w-3.5 h-3.5 inline -mt-0.5')} ${esc(p.vehicle)} · ${nf(p.distance)} km</div></div>
    <div class="text-xl font-extrabold tabular-nums text-right">${rates}</div></div></article>`;
}

const rowFind = id => [...(S.list?.rows || []), ...(S.projCache?.rows || []), ...(S.extra || [])].find(p => p.id === id);
async function fetchProject(id) {
  let p = rowFind(id);
  if (p) return p;
  const d = await api('projects.list', { q: id, limit: 5, from: '', to: '', ae: '' });
  p = d.rows.find(x => x.id === id); if (p) (S.extra = S.extra || []).push(p);
  return p;
}

function financeChart(months) {
  if (!months.length) return empty('Belum ada data Closed Won pada periode ini');
  const W = 720, H = 260, L = 52, R = 12, T = 16, B = 34, max = Math.max(...months.map(m => m.revenue), 1);
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max / p) * p; })(), bw = (W - L - R) / months.length;
  const y = v => T + (H - T - B) * (1 - v / nice), ticks = [0, .25, .5, .75, 1];
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full" role="img" aria-label="Revenue dan profit per bulan">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(nice * t)}" y2="${y(nice * t)}" stroke="currentColor" opacity=".1"/><text x="${L - 6}" y="${y(nice * t) + 4}" text-anchor="end" font-size="10" fill="currentColor" opacity=".6">${short(nice * t)}</text>`).join('')}
    ${months.map((m, i) => { const x = L + i * bw, w = Math.min(34, bw * .55), cx = x + bw / 2; return `<g class="bar" tabindex="0"><title>${m.month}: Revenue ${rp(m.revenue)}, Profit ${rp(m.profit)}, ${m.count} proyek</title>
      <rect x="${cx - w - 1}" y="${y(m.revenue)}" width="${w}" height="${Math.max(0, y(0) - y(m.revenue))}" rx="4" fill="var(--c-rev)"/><rect x="${cx + 1}" y="${y(Math.max(m.profit, 0))}" width="${w}" height="${Math.max(0, y(0) - y(Math.max(m.profit, 0)))}" rx="4" fill="var(--c-prof)"/>
      <text x="${cx}" y="${H - 14}" text-anchor="middle" font-size="10.5" fill="currentColor" opacity=".7">${BULAN[+m.month.slice(5) - 1]} ${m.month.slice(2, 4)}</text></g>`; }).join('')}
  </svg><div class="flex gap-4 text-sm mt-2"><span class="lg"><i style="background:var(--c-rev)"></i>Revenue</span><span class="lg"><i style="background:var(--c-prof)"></i>Profit</span></div>`;
}

  const sync = () => { const v = f.querySelector('input[name=source]:checked').value === 'Vendor'; $('#p-int').classList.toggle('hidden', v); $('#p-ven').classList.toggle('hidden', !v); };
  f.addEventListener('change', e => {
    if (e.target.name === 'source') sync();
    if (e.target.name === 'petugas') f.elements.nopol.value = e.target.dataset.nopol;
  });
  sync();
  f.onsubmit = ev => {
    ev.preventDefault();
    const vendor = f.querySelector('input[name=source]:checked').value === 'Vendor';
    const pe = vendor ? f.elements.vendor.value.trim() : (f.querySelector('input[name=petugas]:checked') || {}).value;
    const err = m => { const e = $('#f-err'); e.textContent = m; e.classList.remove('hidden'); };
    if (!pe) return err(vendor ? 'Isi nama vendor / driver vendor.' : 'Pilih driver internal.');
    if (!f.elements.nopol.value.trim()) return err('Nopol armada wajib diisi.');
    const send = force => api('tasks.confirm', { id: t.id, source: vendor ? 'Vendor' : 'Internal', petugas: pe, helper: f.elements.helper.value, nopol: f.elements.nopol.value, force });
    guard(async () => {
      let r;
      try { r = await send(false); } catch (e) { if (e.code === 'CONFLICT' && confirm(e.message)) r = await send(true); else throw e; }
      Seen.mark([r.task]); closeModal(); toast(`Terkonfirmasi: ${r.task.petugas} · ${r.task.nopol}`); await pollOnce(true); route();
    }, ev.submitter);
  };
});
ACTIONS['ship-next'] = el => guard(async () => {
  const t = taskOf(el.dataset.id), flow = S.boot.shipFlow, i = flow.indexOf(t.ship);
  const next = flow[Math.min(i + 1, flow.length - 1)]; if (i >= flow.length - 1) return;
  if (!confirm(`Ubah status "${t.project}" menjadi ${next}?`)) return;
  await api('tasks.status', { id: t.id, status: next }); toast('Status: ' + next); await pollOnce(true); route();
}, el);
ACTIONS['cancel-task'] = el => guard(async () => {
  const t = taskOf(el.dataset.id);
  if (!confirm(`Batalkan penugasan "${t.project}"?\nPilih OK untuk membatalkan; task akan hilang dari daftar driver.`)) return;
  await api('tasks.status', { id: t.id, status: 'Dibatalkan' }); toast('Penugasan dibatalkan'); await pollOnce(true); route();
}, el);

/* --------------------------- TAMPILAN DRIVER --------------------------- */
const NEXT_LABEL = { 'Ditugaskan': ['Mulai menuju lokasi pick up', 'Menuju Pickup'], 'Menuju Pickup': ['Mulai perjalanan pengiriman', 'Dalam Perjalanan'], 'Dalam Perjalanan': ['Tandai selesai', 'Selesai'] };
const mapsUrl = q => 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(q);
PAGES.tugas = {
  async render(view) {
    const act = S.tasks.filter(t => t.ship !== 'Selesai' && t.status === 'Terkonfirmasi').sort((a, b) => a.pickup.localeCompare(b.pickup));
    const hist = S.tasks.filter(t => t.ship === 'Selesai').slice(0, 15), fresh = new Set(S.alerts.map(a => a.t.id));
    const steps = ['Ditugaskan', 'Menuju Pickup', 'Dalam Perjalanan', 'Selesai'];
    view.innerHTML = `<div class="max-w-xl mx-auto"><div class="mb-5"><p class="text-ink/60 text-sm">Halo,</p><h1 class="h1">${esc(S.user.name)}</h1></div>
    <div class="grid grid-cols-3 gap-2 mb-5"><div class="stat"><span class="lbl-s">Aktif</span><span class="big">${act.length}</span></div><div class="stat"><span class="lbl-s">Hari ini</span><span class="big">${act.filter(t => t.pickup.slice(0, 10) === todayStr()).length}</span></div><div class="stat st-won"><span class="lbl-s">Selesai</span><span class="big">${hist.length}</span></div></div>
    <h2 class="h2 mb-3">Tugas delivery</h2><div class="space-y-4">${act.map(t => { const si = steps.indexOf(t.ship), nx = NEXT_LABEL[t.ship]; return `<article class="task big-task ${fresh.has(t.id) ? 'new' : ''}">
      <div class="flex items-center justify-between gap-2"><div class="flex gap-2 items-center"><span class="svc">${esc(t.service)}</span>${fresh.has(t.id) ? chip('BARU', 'chip-red blink') : ''}</div><div class="text-sm font-bold">${esc(dayName(t.pickup))}, ${esc(fmtDT(t.pickup))}</div></div>
      <h3 class="font-extrabold text-xl leading-snug mt-2">${esc(t.project)}</h3>
      <div class="plate lg mt-2">${esc(t.nopol)}</div>
      <dl class="mt-4 space-y-3 text-[15px]"><div class="flex gap-3">${ico('pin', 'w-5 h-5 text-forest mt-0.5')}<div><dt class="lbl-s">Lokasi pick up</dt><dd class="font-semibold">${esc(t.pickupLoc)}</dd></div></div>
        <div class="flex gap-3">${ico('nav', 'w-5 h-5 text-ember mt-0.5')}<div><dt class="lbl-s">Destination</dt><dd class="font-semibold">${esc(t.dest)}</dd></div></div>
        ${t.helper ? `<div class="flex gap-3">${ico('user', 'w-5 h-5 mt-0.5')}<div><dt class="lbl-s">Helper</dt><dd class="font-semibold">${esc(t.helper)}</dd></div></div>` : ''}
        ${t.notes ? `<div class="text-sm text-ink/60 italic">“${esc(t.notes)}”</div>` : ''}</dl>
      <ol class="stepper mt-4">${steps.map((s, i) => `<li class="${i <= si ? 'on' : ''}"><i></i><span>${s}</span></li>`).join('')}</ol>
      <div class="grid gap-2 mt-4"><a class="btn-ghost justify-center" target="_blank" rel="noopener" href="${mapsUrl(t.ship === 'Dalam Perjalanan' ? t.dest : t.pickupLoc)}">${ico('map', 'w-4 h-4')} Buka Google Maps</a>
      ${nx ? `<button class="btn-primary !py-4 text-base" data-act="drv-status" data-id="${esc(t.id)}" data-to="${nx[1]}">${esc(nx[0])}</button>` : ''}</div></article>`; }).join('') || empty('Belum ada tugas. Notifikasi akan berdering saat koordinator menugaskan Anda.')}</div>
    ${hist.length ? `<h2 class="h2 mt-8 mb-3">Riwayat</h2><div class="card !p-0 divide-y divide-ink/10">${hist.map(t => `<div class="p-3.5 flex justify-between gap-3 text-sm"><div class="min-w-0"><div class="font-semibold truncate">${esc(t.project)}</div><div class="text-xs text-ink/60">${esc(t.pickupLoc)} → ${esc(t.dest)}</div></div><div class="text-xs text-ink/50 shrink-0">${esc(fmtD(t.pickup))}</div></div>`).join('')}</div>` : ''}</div>`;
  }
};
ACTIONS['drv-status'] = el => guard(async () => {
  if (el.dataset.to === 'Selesai' && !confirm('Tandai pengiriman ini selesai?')) return;
  const r = await api('tasks.status', { id: el.dataset.id, status: el.dataset.to }); Seen.mark([r.task]); toast('Status: ' + el.dataset.to); await pollOnce(true); route();
}, el);


/* ==========================================================================
   BOOT
   ========================================================================== */
(async function boot() {
  if (DEMO) { app().innerHTML = `<div class="min-h-dvh grid place-items-center p-8"><div class="card max-w-lg"><h1 class="text-xl font-extrabold mb-2">API_URL belum diisi</h1><p class="text-sm opacity-80">Buka <b>index.html</b>, cari <code>window.APP_CONFIG</code>, lalu tempel URL Web App Google Apps Script (yang berakhiran <code>/exec</code>) pada <code>API_URL</code>. Langkahnya ada di PANDUAN.md bagian 3.</p></div></div>`; return; }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => { });
  if (S.token) {
    try { const r = await api('me'); S.user = r.user; await startApp(); return; }
    catch (e) { if (e.code === 'NET') { app().innerHTML = `<div class="min-h-dvh grid place-items-center p-8 text-center"><div><p class="font-bold mb-3">Tidak dapat terhubung ke server.</p><button class="btn-dark" onclick="location.reload()">Coba lagi</button></div></div>`; return; } }
  }
  window.showLogin();
})();

</script>
</body>
